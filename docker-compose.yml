version: '3.8'

services:
  # PostgreSQL Persistent Metadata Database
  postgres_db:
    image: postgres:16-alpine
    container_name: datasense_postgres
    restart: always
    environment:
      POSTGRES_USER: datasense_user
      POSTGRES_PASSWORD: datasense_password
      POSTGRES_DB: datasense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datasense_user -d datasense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend API Service
  backend_api:
    build: .
    container_name: datasense_backend
    restart: always
    command: uvicorn datasense.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=DataSense AI
      - APP_ENV=development
      - DATABASE_URL=postgresql://datasense_user:datasense_password@postgres_db:5432/datasense_db
      - POSTGRES_SERVER=postgres_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=datasense_user
      - POSTGRES_PASSWORD=datasense_password
      - POSTGRES_DB=datasense_db
    depends_on:
      postgres_db:
        condition: service_healthy

  # Streamlit Analytics Dashboard Service
  dashboard:
    build: .
    container_name: datasense_dashboard
    restart: always
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend_api:8000
    depends_on:
      - backend_api

volumes:
  postgres_data:
