version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: datasense_db
    environment:
      POSTGRES_USER: datasense_user
      POSTGRES_PASSWORD: datasense_password
      POSTGRES_DB: datasense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datasense_user -d datasense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MLflow Tracking Server Service
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.0
    container_name: datasense_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow

  # FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: datasense_backend
    environment:
      - DATABASE_URL=postgresql://datasense_user:datasense_password@db:5432/datasense_db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - APP_ENV=production
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started

  # Streamlit Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: datasense_frontend
    environment:
      - DATABASE_URL=postgresql://datasense_user:datasense_password@db:5432/datasense_db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - BACKEND_API_URL=http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data:
  mlflow_data:
